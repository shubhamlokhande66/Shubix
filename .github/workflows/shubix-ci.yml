name: Shubix CI

on:
  # by hand only (Actions, Shubix CI, Run workflow; pick the branch): not on PRs, pushes or main, so Actions minutes are
  # spent only when the owner chooses (the free ones ran out in 3 days, 2026-11-03). Checks only; nothing deploys here.
  workflow_dispatch:

concurrency:
  group: shubix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-and-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shubix
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shubix/pnpm-lock.yaml
      - name: Install FFmpeg for audio-analysis tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared core
        run: pnpm --filter @shubix/core build
      - name: Typecheck workspace packages
        run: pnpm -r typecheck
      - name: Run API tests
        run: pnpm --filter @shubix/api test
      - name: Run Android tests
        run: pnpm --filter @shubix/mobile-app test
      - name: Run web tests
        run: pnpm --filter @shubix/web-app test
      # the studio's beat tracker against songs whose beats are known (FE/web-app/scripts/studio-beats/README.md): the
      # clean sets are the same on every computer and fail the run when they get worse; the phone sets go through
      # ffmpeg's MP3 encoder, which differs between versions, so they are shown and not checked here
      - name: Beat accuracy benchmark
        working-directory: shubix/FE/web-app/scripts/studio-beats
        run: |
          python3 -m pip install --quiet --user --break-system-packages numpy || python3 -m pip install --quiet --user numpy
          node make-sets.mjs "$RUNNER_TEMP/beats"
          node bench.mjs --check baseline.json "$RUNNER_TEMP/beats/set1" "$RUNNER_TEMP/beats/set2" "$RUNNER_TEMP/beats/set3"
          node bench.mjs "$RUNNER_TEMP/beats/deg1" "$RUNNER_TEMP/beats/deg2" "$RUNNER_TEMP/beats/deg3"
      # the two trackers together, as the studio uses them. Shown, and compared with the kept results, but it does not
      # fail the run: ffmpeg's resampler differs a little between versions, and one song changing tracker moves a set
      - name: Beat accuracy benchmark, with the neural tracker
        continue-on-error: true
        working-directory: shubix/FE/web-app/scripts/studio-beats
        run: |
          node beatthis.mjs "$RUNNER_TEMP/beats/set1" "$RUNNER_TEMP/beats/set2" "$RUNNER_TEMP/beats/set3"
          node bench.mjs --check baseline.json "$RUNNER_TEMP/beats/set1" "$RUNNER_TEMP/beats/set2" "$RUNNER_TEMP/beats/set3"
      - name: Build web app
        run: pnpm --filter @shubix/web-app build

  android-native-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shubix
    steps:
      # the native build (CMake for reanimated / worklets) needs more room than the runner leaves free: the toolchains
      # this job never uses go first (it ran out of disk after 20 minutes)
      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/PyPy" "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/go" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shubix/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Android native project
        run: pnpm --filter @shubix/mobile-app exec expo prebuild --platform android --no-install
      - name: Assemble Android debug APK
        working-directory: shubix/FE/mobile-app/android
        # one architecture is enough to prove the native build compiles (all four filled the disk); releases build all
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
