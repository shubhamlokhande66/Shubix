name: Deploy website (Cloudflare Workers)

# The website (shubix/FE/web-app) on Cloudflare Workers through OpenNext, by hand: Actions, Deploy website (Cloudflare
# Workers), Run workflow, pick qa / uat. Built here (OpenNext on Linux), deployed with wrangler to shubix-web-<target>
# (shubix/FE/web-app/wrangler.jsonc). Each deploys its own branch (qa, uat). The same Cloudflare secrets as the API's
# workflow: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Production stays on Vercel until QA and UAT are checked here.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy the website"
        type: choice
        options: [qa, uat]
        default: qa

concurrency:
  group: deploy-cloudflare-web-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      # the build bakes these in (next.config.ts's /api rewrite, the pages' address)
      API_URL: https://api-${{ inputs.target }}.shubix.in
      PUBLIC_BASE_URL: https://${{ inputs.target }}.shubix.in
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: The Cloudflare secrets are there
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repo secrets first."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shubix/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter "@shubix/web-app..."
        working-directory: shubix
      - name: Build (OpenNext)
        working-directory: shubix/FE/web-app
        run: pnpm cf:build
      - name: Deploy (wrangler)
        working-directory: shubix/FE/web-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env "$TARGET" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Website on Workers ($TARGET): ${url:-see the log above}"
          if [ -n "$url" ]; then code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$url/"); echo "Home page: $code"; test "$code" = 200 || { echo "::error::$url answered $code"; exit 1; }; fi
