name: Deploy to Cloudflare
on:
  # by hand only (Actions, Deploy to Cloudflare, Run workflow, pick qa / uat / prod): a merge does not deploy by itself,
  # so Actions minutes are spent only when the owner chooses (the free ones ran out in 3 days, 2026-11-03).
  # qa deploys the branch the workflow is started from ("Use workflow from": qa itself, or a feature branch to try on QA);
  # uat always deploys uat and prod always main, whatever branch is picked (docs/environments.md).
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy the API"
        type: choice
        options: [qa, uat, prod]
        default: qa
concurrency:
  group: deploy-cloudflare-${{ inputs.target }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environments (Settings, Environments): "production" can ask for an approval before it runs
    environment: ${{ inputs.target == 'prod' && 'production' || inputs.target }}
    env:
      SOURCE: ${{ inputs.target == 'qa' && github.ref_name || (inputs.target == 'prod' && 'main' || 'uat') }}
    defaults:
      run:
        working-directory: shubix/infra/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - name: What is deployed
        run: echo "::notice::${{ inputs.target }} gets branch ${{ env.SOURCE }} at $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # public/ and the AI models become static assets (cf-assets.mjs); the web app's vendor files come from its node_modules
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts --filter "@shubix/web-app"
        working-directory: shubix
      - run: npm ci && node cf-assets.mjs
      # production is the configuration's top level (shubix-api); qa and uat are its environments (shubix-api-qa, -uat)
      - run: npx wrangler deploy ${{ inputs.target != 'prod' && format('--env {0}', inputs.target) || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: One request to the new API, so its container can sleep
        # a deploy starts the new container, but its sleep timer only runs once a request comes: with no traffic (QA, UAT)
        # it stayed awake, and billed, for hours (2026-11-13). One health request starts the timer; it sleeps a few minutes
        # later. Tried for up to 2 minutes (the old container can answer for a moment); a miss only warns.
        run: |
          if [ "${{ inputs.target }}" = prod ]; then url="https://shubix.in"; else url="https://${{ inputs.target }}.shubix.in"; fi
          api=""; for i in $(seq 1 12); do api=$(curl -s -m 30 "$url/api/health" || true); echo "$api" | grep -q '"ok"' && break; sleep 10; done
          echo "API health: $api"; echo "$api" | grep -q '"ok"' || echo "::warning::$url/api/health did not answer: the new container may stay awake until its first request"
      - name: Old copies out of Cloudflare's cache
        # every page and file of shubix.in (all its addresses) fetched fresh after a deploy: people get the new version at once.
        # The token needs Zone: Read and Zone: Cache Purge; without them this only warns.
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone=$(curl -s -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=shubix.in" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result[0].id)}catch{console.log("")}})')
          if [ -z "$zone" ]; then echo "::warning::Cache not purged: the Cloudflare token cannot read the shubix.in zone (give it Zone: Read and Zone: Cache Purge)."; exit 0; fi
          r=$(curl -s -m 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}' "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache")
          if echo "$r" | grep -q '"success":true'; then echo "::notice::Cloudflare cache purged"; else echo "::warning::Cache not purged: $r (the token needs Zone: Cache Purge)"; fi
