name: Deploy to Cloudflare
on:
  # by hand only (Actions, Deploy to Cloudflare, Run workflow, pick qa / uat / prod): a merge does not deploy by itself,
  # so Actions minutes are spent only when the owner chooses (the free ones ran out in 3 days, 2026-11-03).
  # Each environment deploys its own branch (qa, uat, main), whatever branch the workflow is started from
  # (docs/environments.md).
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy the API"
        type: choice
        options: [qa, uat, prod]
        default: qa
concurrency:
  group: deploy-cloudflare-${{ inputs.target }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub environments (Settings, Environments): "production" can ask for an approval before it runs
    environment: ${{ inputs.target == 'prod' && 'production' || inputs.target }}
    defaults:
      run:
        working-directory: shubix/infra/cloudflare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target == 'prod' && 'main' || inputs.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # public/ and the AI models become static assets (cf-assets.mjs); the web app's vendor files come from its node_modules
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts --filter "@shubix/web-app"
        working-directory: shubix
      - run: npm ci && node cf-assets.mjs
      # production is the configuration's top level (shubix-api); qa and uat are its environments (shubix-api-qa, -uat)
      - run: npx wrangler deploy ${{ inputs.target != 'prod' && format('--env {0}', inputs.target) || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
